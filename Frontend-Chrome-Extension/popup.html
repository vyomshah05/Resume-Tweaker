<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Tweaker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Resume Tweaker</h1>
        <p class="subtitle">ATS-optimized for any job</p>
      </div>
    </header>

    <main>
      <div class="field">
        <label>Current Page</label>
        <div id="pageInfo" class="page-info">
          <span id="pageTitle" class="page-title">Loading...</span>
          <span id="pageUrl" class="page-url"></span>
        </div>
      </div>

      <button id="submitBtn" class="btn-primary">
        <span class="btn-text">Tweak &amp; Open in Overleaf</span>
        <span class="btn-spinner" hidden>
          <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          Generating...
        </span>
      </button>

      <div id="status" class="status" hidden></div>
    </main>

    <footer>
      <span>Backend: <code>localhost:8000</code></span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
