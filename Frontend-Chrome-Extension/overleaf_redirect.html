<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Opening in Overleaf...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8f9fa;
      color: #374151;
    }
    p { font-size: 16px; }
  </style>
</head>
<body>
  <p>Sending your resume to Overleaf...</p>
  <form id="ol" action="https://www.overleaf.com/docs" method="POST">
    <input type="hidden" name="snip"      id="snipField" />
    <input type="hidden" name="snip_name" value="tweaked_resume.tex" />
  </form>
  <script>
    chrome.storage.local.get("tweakedLatex", ({ tweakedLatex }) => {
      if (!tweakedLatex) {
        document.querySelector("p").textContent = "Error: no LaTeX content found.";
        return;
      }
      document.getElementById("snipField").value = tweakedLatex;
      document.getElementById("ol").submit();
      chrome.storage.local.remove("tweakedLatex");
    });
  </script>
</body>
</html>
